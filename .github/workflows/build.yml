name: Build image

on:
    push:
        branches: [ master ]
        paths-ignore:
            - 'docs/**'
            - '**.md'
            - '.github/dependabot.yml'
            - '.github/workflows/dependabot-helper.yml'
            - '.github/dependabot-helper.md'
            - '.github/CODEOWNERS'
    pull_request:

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE: ghcr.io/cerbrus/cardscanner-app

jobs:
    checks:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            built: ${{ steps.version.outputs.built }}
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Work out the version
                id: version
                run: |
                    VERSION=$(bash .github/scripts/version.sh)
                    BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                    echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                    echo "built=$BUILT" >> "$GITHUB_OUTPUT"
                    {
                        echo "## Version $VERSION"
                        echo
                        echo "| | |"
                        echo "|---|---|"
                        echo "| Commit | \`${GITHUB_SHA::7}\` |"
                        echo "| Built | $BUILT |"
                        if [ "$GITHUB_EVENT_NAME" = push ]; then
                            echo "| Published | image tagged latest and $VERSION, git tag v$VERSION |"
                        else
                            echo "| Published | no: pull request, build only |"
                        fi
                    } >> "$GITHUB_STEP_SUMMARY"
                    echo "::notice title=Version::$VERSION"
            -   uses: actions/setup-node@v7
                with:
                    node-version: 25
                    cache: yarn
            -   run: yarn install --immutable
            -   run: yarn lint:all
            -   run: yarn card-api:test
            -   run: yarn card-api:test:integration
            -   run: yarn card-front:test
            -   name: Run the built app in a browser
                run: yarn e2e
            -   name: Show the page of a failed browser test
                if: failure()
                run: cat /tmp/cardscanner-e2e-results/*/error-context.md | head -200
            -   name: Check the shell scripts
                run: shellcheck deployment/*.sh .github/scripts/*.sh

    image:
        name: app image ${{ needs.checks.outputs.version }}
        needs: checks
        runs-on: ubuntu-24.04-arm
        steps:
            -   uses: actions/checkout@v7

            -   uses: docker/setup-buildx-action@v4

            -   name: Log in to the registry
                if: github.event_name == 'push'
                uses: docker/login-action@v4
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build
                uses: docker/build-push-action@v7
                with:
                    context: .
                    file: Dockerfile
                    platforms: linux/arm64
                    load: true
                    build-args: |
                        APP_VERSION=${{ needs.checks.outputs.version }}
                        APP_COMMIT=${{ github.sha }}
                        APP_BUILT=${{ needs.checks.outputs.built }}
                    tags: |
                        ${{ env.IMAGE }}:latest
                        ${{ env.IMAGE }}:${{ needs.checks.outputs.version }}
                        ${{ env.IMAGE }}:${{ github.sha }}
                    cache-from: type=gha,scope=app
                    cache-to: type=gha,mode=max,scope=app

            -   name: Start the image once and ask for its health
                run: |
                    docker run -d --name smoke -p 3030:3030 -e BACKGROUND_JOBS=off -e DATABASE_PATH=/tmp/app.db "$IMAGE:latest"
                    for attempt in $(seq 1 30); do
                        if curl -fsS http://127.0.0.1:3030/api/v1/health; then
                            echo
                            curl -fsS http://127.0.0.1:3030/ | grep -q '<app-root>'
                            docker rm -f smoke
                            exit 0
                        fi
                        sleep 2
                    done
                    docker logs smoke
                    exit 1

            -   name: Push
                if: github.event_name == 'push'
                run: docker push --all-tags "$IMAGE"

    tag:
        name: tag v${{ needs.checks.outputs.version }}
        needs: [ checks, image ]
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Tag the commit with its version and publish release notes
                env:
                    TAG: v${{ needs.checks.outputs.version }}
                    GH_TOKEN: ${{ github.token }}
                run: |
                    if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
                        echo "$TAG exists already"
                        exit 0
                    fi

                    PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
                    {
                        echo "Image: \`ghcr.io/cerbrus/cardscanner-app:${TAG#v}\`"
                        echo
                        echo "## Changes${PREVIOUS:+ since $PREVIOUS}"
                        echo
                        git log --no-merges --format='- %s (%h)' ${PREVIOUS:+"$PREVIOUS.."}"$GITHUB_SHA"
                    } > notes.md

                    git tag "$TAG" "$GITHUB_SHA"
                    git push origin "$TAG"
                    gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
